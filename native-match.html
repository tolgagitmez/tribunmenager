<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tribün Manager | League-Soccer pilot yayını</title>
<style>
*{box-sizing:border-box}body{margin:20px auto;padding:0 14px;max-width:1100px;background:#101923;color:#edf3f8;font:15px system-ui}h1{font-size:24px}p{color:#b8c9d9}a{color:#8ccaff}canvas{display:block;width:100%;aspect-ratio:16/9;background:#26734b;border-radius:10px}button,select{font:inherit;color:white;background:#203242;border:1px solid #526778;border-radius:6px;padding:8px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}#score{font-size:24px;font-weight:bold;font-variant-numeric:tabular-nums}#stats{white-space:pre-line}

<a href="league.html">Lig merkezine dön</a>
<h1>League-Soccer · Sunucu yayını</h1>
<p>Deneysel paralel maç kaydıdır. Resmî lig sonucunu değiştirmez. Motor tamamlandıktan sonra ortak 5 dakikalık yayın başlar; menajer müdahalesi henüz desteklenmez.</p>
<div class="row"><label>Maç günü <select id="round"></select></label><button id="connect">Bağlan</button><span id="mode"></span></div>
<div id="score" aria-live="polite">Bağlantı bekleniyor</div><p id="clock"></p>
<canvas id="pitch" width="960" height="540" aria-label="League-Soccer 3D maç yayını"></canvas>
<div class="row"><button id="camera">Kamera: TV</button><label>Grafik <select id="quality"><option value="performance">Performans</option><option value="balanced" selected>Dengeli</option><option value="quality">Kalite</option></select></label></div>
<p id="status" role="status"></p><div id="stats"></div><div data-player-asset-diagnostics></div>
<script src="humanoid-rig.js"></script><script src="player-asset-status.js"></script><script src="assets/player/player-model-data.js"></script><script src="player-skinning.js"></script><script src="character-palette-constraints.js"></script><script src="player-renderer.js"></script><script src="match-animation-bridge.js"></script><script src="pitch-laws.js"></script><script src="ball-visual.js"></script><script src="scene3d.js"></script><script src="integrations/league-soccer/native-replay.js"></script><script src="integrations/league-soccer/native-stream-view.js"></script><script src="integrations/league-soccer/native-stream-ui.js"></script>
</body></html>
