name: Stage 139 authenticated native gateway
on:
  push:
    branches: [experiment/native-league-auth-stage139]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest discover -s tests -p test_native_av_gateway.py
          python3 -m unittest discover -s tests -p test_native_live.py
          python3 -m unittest discover -s tests -p test_native_av_queue.py
          python3 -m py_compile server.py native_av_gateway.py
