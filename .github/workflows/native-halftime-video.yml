name: Original native halftime roster video pilot
on:
  push:
    branches: [experiment/native-roster-stage118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roster:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p test_native_roster.py
      - run: python3 -m unittest discover -s tests -p test_native_video_control.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xdotool xvfb xauth
      - name: Build pinned native OpenGL runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/roster-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Verify both preconfigured native halftime changes in a recorded full match
        run: |
          node -e 'const c=require("./integrations/league-soccer/fixture-adapter.cjs").substitutionDemo(); console.log(JSON.stringify(c))' > "$RUNNER_TEMP/roster-fixture.json"
          python3 integrations/league-soccer/native-video-pilot.py "$RUNNER_TEMP/roster-runtime" "$RUNNER_TEMP/roster-fixture.json" "$RUNNER_TEMP/roster-result" --halftime-plan
          python3 - "$RUNNER_TEMP/roster-result/native-video-report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["roster"]["allPlannedChangesObserved"] and len(r["roster"]["changes"])==2
          assert r["nativeClock"]["nativeElapsedMs"]==300000
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-roster-measurements-only
          path: |
            ${{ runner.temp }}/roster-result/native-video-report.json
            ${{ runner.temp }}/roster-result/runner.log
            ${{ runner.temp }}/roster-result/native-match.game.log
            ${{ runner.temp }}/roster-result/match.ndjson.season.json
          if-no-files-found: ignore
