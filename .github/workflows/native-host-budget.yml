name: Stage 143 single vs dual host budget
on:
  push:
    branches: [experiment/native-host-budget-stage143]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 -m unittest discover -s tests -p test_native_worker_recovery.py
          python3 -m unittest discover -s tests -p test_native_av_queue.py
          python3 -m unittest discover -s tests -p test_native_host_budget.py
          python3 -m unittest discover -s tests -p test_native_motion_audit.py
          python3 -m unittest discover -s tests -p test_native_audio_capture.py
          python3 -m unittest discover -s tests -p test_native_av_isolation.py
          python3 -m unittest discover -s tests -p test_native_admission.py
          python3 -m unittest discover -s tests -p test_native_av_capacity.py
          python3 -m py_compile integrations/league-soccer/native-video-pilot.py integrations/league-soccer/native-av-capacity.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xdotool xvfb xauth pulseaudio pulseaudio-utils libopenal-dev
      - name: Verify simultaneous private Pulse servers
        run: python3 integrations/league-soccer/native_audio_isolation_smoke.py
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Build pinned engine
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/render-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare one match with two concurrent matches
        run: |
          set -uo pipefail
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/render-fixtures" || exit 1
          mkdir "$RUNNER_TEMP/budget"
          failed=0
          for trial in single dual-baseline dual-bounded; do
            count=2; gl=2; enc=2
            if [ "$trial" = single ]; then count=1; fi
            if [ "$trial" = dual-bounded ]; then gl=1; enc=1; fi
            python3 integrations/league-soccer/native-av-capacity.py "$RUNNER_TEMP/render-runtime" "$RUNNER_TEMP/render-fixtures" "$RUNNER_TEMP/budget/$trial" --count "$count" --motion-audit --gl-workers "$gl" --encoder-threads "$enc" --filter-threads 1 || failed=1
          done
          python3 integrations/league-soccer/native_host_budget.py "$RUNNER_TEMP/budget" "$RUNNER_TEMP/host-budget.json"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-budget-evidence
          path: |
            ${{ runner.temp }}/host-budget.json
            ${{ runner.temp }}/budget/*/capacity-report.json
            ${{ runner.temp }}/budget/*/*/live-report.json
            ${{ runner.temp }}/budget/*/*/browser-playback-report.json
            ${{ runner.temp }}/budget/*/*/native-motion-report.json
          if-no-files-found: ignore
