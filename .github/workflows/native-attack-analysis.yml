name: Native attack bottleneck analysis tests
on:
  push:
    paths:
      - 'tools/native-attack-bottlenecks*.cjs'
      - '.github/workflows/native-attack-analysis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/native-attack-bottlenecks.test.cjs
