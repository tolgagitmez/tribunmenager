name: Native task worker limit diagnostic
on:
  push:
    branches: [experiment/native-thread-stage48]
    paths:
      - 'integrations/league-soccer/**'
      - 'tests/test_native_worker_limit.py'
      - '.github/workflows/native-worker-limit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-limit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p test_native_worker_limit.py
      - name: Build pinned runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/worker-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare auto and capped native worker pool
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/worker-fixtures"
          python3 integrations/league-soccer/worker-limit-benchmark.py "$RUNNER_TEMP/worker-runtime" "$RUNNER_TEMP/worker-fixtures/balanced.json" "$RUNNER_TEMP/worker-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-worker-limit
          path: ${{ runner.temp }}/worker-results/
          if-no-files-found: ignore
