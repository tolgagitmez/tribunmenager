name: Stage 223 native rendered-frame calibration
on:
  pull_request:
    branches: [experiment/native-clock-alignment-stage222]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 -m unittest discover -s tests -p test_native_entrypoint.py
          python3 -m unittest discover -s tests -p test_launcher.py
          bash -n BASLAT.sh
          bash -n integrations/league-soccer/run-frozen.sh
          python3 -m py_compile integrations/league-soccer/native_gpu_display.py integrations/league-soccer/native-video-pilot.py integrations/league-soccer/native_av_queue.py
          python3 -m unittest discover -s tests -p test_native_wsl_gpu.py
          python3 -m unittest discover -s tests -p test_native_alpha.py
          python3 -m unittest discover -s tests -p test_native_attack_profile.py
          python3 -m unittest discover -s tests -p test_native_attack_intensity.py
          python3 -m unittest discover -s tests -p test_native_compare_194.py
          bash -n BASLAT_NATIVE_ALFA.sh
          python3 -m unittest discover -s tests -p test_native_duel_av.py
          python3 -m unittest discover -s tests -p test_native_controlled_carry_av.py
          python3 -m unittest discover -s tests -p test_native_timed_pass_av.py
          python3 -m unittest discover -s tests -p test_native_box_entry_av.py
          python3 -m unittest discover -s tests -p test_native_render_composition.py
          python3 -m unittest discover -s tests -p test_native_render_suite.py
          python3 -m unittest discover -s tests -p test_native_texture_cache.py
          python3 -m unittest discover -s tests -p test_native_vao_cache.py
          python3 -m unittest discover -s tests -p test_native_skinning_cache.py
          python3 -m unittest discover -s tests -p test_native_shadow_resolution.py
          python3 -m unittest discover -s tests -p test_native_render_resolution.py
          bash -n integrations/league-soccer/run-frozen.sh
          python3 -m unittest discover -s tests -p test_native_render_resolution_comparison.py
          python3 -m unittest discover -s tests -p test_native_verification_lease.py
          python3 -m unittest discover -s tests -p test_native_match_lifecycle.py
          node --check league.js
          python3 -m unittest discover -s tests -p test_native_stall_diagnostics.py
          python3 -m unittest discover -s tests -p test_native_action_diagnostics.py
          python3 -m unittest discover -s tests -p test_native_animation_rejections.py
          python3 -m unittest discover -s tests -p test_native_skeleton_diagnostics.py
          python3 -m unittest discover -s tests -p test_native_transition_motion.py
          python3 -m unittest discover -s tests -p test_native_dribble_diagnostics.py
          python3 -m unittest discover -s tests -p test_native_duel_escape_diagnostics.py
          python3 -m unittest discover -s tests -p test_native_pressure_hold_diagnostics.py
          python3 -m unittest discover -s tests -p test_native_pass_timing_diagnostics.py
          python3 -m unittest discover -s tests -p test_native_combination_diagnostics.py
          python3 -m unittest discover -s tests -p test_native_offball_diagnostics.py
          python3 -m unittest discover -s tests -p test_native_integration_gate.py
          python3 -m unittest discover -s tests -p test_native_evidence_summary.py
          python3 -m unittest discover -s tests -p test_native_match_quality.py
          python3 -m unittest discover -s tests -p test_native_private_beta.py
          python3 -m py_compile integrations/league-soccer/native_private_beta.py
          node --check native-beta-login.js
          python3 -m unittest discover -s tests -p test_native_release_gate.py
          node --test integrations/league-soccer/native-live-video.test.cjs
          python3 -m unittest discover -s tests -p test_native_only_league.py
          python3 -m unittest discover -s tests -p test_native_private_media.py
          node --check integrations/league-soccer/native-league-screen-browser.cjs
          python3 -m py_compile integrations/league-soccer/native_league_e2e.py
          python3 -m unittest discover -s tests -p test_native_league_command_verify.py
          python3 -m unittest discover -s tests -p test_native_av_gateway.py
          python3 -m unittest discover -s tests -p test_native_league_key.py
          python3 -m unittest discover -s tests -p test_native_audio_ownership.py
          python3 -m unittest discover -s tests -p test_native_motion_audit.py
          python3 -m unittest discover -s tests -p test_native_audio_capture.py
          python3 -m unittest discover -s tests -p test_native_av_isolation.py
          python3 -m unittest discover -s tests -p test_native_admission.py
          python3 -m unittest discover -s tests -p test_native_av_capacity.py
          python3 -m py_compile integrations/league-soccer/native-video-pilot.py integrations/league-soccer/native-av-capacity.py
      - name: Apply patches and compile full patched policy test before costly setup
        id: policy
        env:
          TRIBUN_POLICY_ONLY: '1'
        run: |
          set -o pipefail
          bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/patch-preflight.ndjson" 2>&1 | tee "$RUNNER_TEMP/native-policy.log"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xdotool xvfb xauth pulseaudio pulseaudio-utils libopenal-dev
      - name: Verify simultaneous private Pulse servers
        run: python3 integrations/league-soccer/native_audio_isolation_smoke.py
      - name: Verify two real OpenAL sources with distinct tones
        run: python3 integrations/league-soccer/native_openal_isolation_smoke.py
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Build pinned engine
        id: build
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/render-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: |
          set -o pipefail
          bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo 2>&1 | tee "$RUNNER_TEMP/native-build.log"
      - name: Baseline private match
        id: baseline
        run: |
          bash BASLAT.sh --native-attack-profile lanes --native-runtime "$RUNNER_TEMP/render-runtime" --native-session-root "$RUNNER_TEMP/alpha-state" --port 18765 --native-delay 30
      - name: Preserve baseline match evidence immediately
        if: always() && steps.baseline.outcome != 'skipped' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-baseline-match-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/alpha-state/alpha-*/match/private-beta-report.json
            ${{ runner.temp }}/alpha-state/alpha-*/match/*/run/native-match.game.log
            ${{ runner.temp }}/alpha-state/alpha-*/match/*/run/match.ndjson
      - name: Experimental private match
        id: experimental
        if: always() && steps.build.outcome == 'success'
        run: |
          bash BASLAT.sh --native-attack-profile coordinated --native-runtime "$RUNNER_TEMP/render-runtime" --native-session-root "$RUNNER_TEMP/coordinated-state" --port 18766 --native-delay 30
      - name: Preserve experimental match evidence immediately
        if: always() && steps.experimental.outcome != 'skipped' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-experimental-match-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/coordinated-state/alpha-*/match/private-beta-report.json
            ${{ runner.temp }}/coordinated-state/alpha-*/match/*/run/native-match.game.log
            ${{ runner.temp }}/coordinated-state/alpha-*/match/*/run/match.ndjson
      - name: Validate real match evidence for both profiles
        id: evidence_gate
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          baseline=("$RUNNER_TEMP"/alpha-state/alpha-*/match/private-beta-report.json)
          experiment=("$RUNNER_TEMP"/coordinated-state/alpha-*/match/private-beta-report.json)
          [[ ${#baseline[@]} == 1 && ${#experiment[@]} == 1 ]] || { echo "Missing or ambiguous real match reports" >&2; exit 1; }
          rc=0
          python3 integrations/league-soccer/native_compare_194.py "${baseline[0]}" "${experiment[0]}" "$RUNNER_TEMP/attack-comparison.json" || rc=1
          if [[ -f "$RUNNER_TEMP/attack-comparison.json" ]]; then cat "$RUNNER_TEMP/attack-comparison.json"; fi
          python3 integrations/league-soccer/native_integration_gate.py "${baseline[0]}" lanes "$RUNNER_TEMP/baseline-evidence.json" || rc=1
          python3 integrations/league-soccer/native_integration_gate.py "${experiment[0]}" coordinated "$RUNNER_TEMP/coordinated-evidence.json" || rc=1
          exit "$rc"
      - name: Publish real match evidence diagnostics
        if: always() && !cancelled()
        env:
          GATE_OUTCOME: ${{ steps.evidence_gate.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          EXPERIMENTAL_OUTCOME: ${{ steps.experimental.outcome }}
        run: python3 integrations/league-soccer/native_evidence_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-entrypoint-private-report
          path: |
            ${{ runner.temp }}/alpha-state/alpha-*/match/private-beta-report.json
            ${{ runner.temp }}/alpha-state/alpha-*/match/**/native-match.game.log
            ${{ runner.temp }}/coordinated-state/alpha-*/match/private-beta-report.json
            ${{ runner.temp }}/coordinated-state/alpha-*/match/**/native-match.game.log
            ${{ runner.temp }}/native-policy.log
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/baseline-evidence.json
            ${{ runner.temp }}/coordinated-evidence.json
            ${{ runner.temp }}/attack-comparison.json
          if-no-files-found: warn
  extended_trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Verify highlight detection on synthetic test fixtures
        run: python3 -m unittest discover -s tests -p test_native_highlight_detection.py
      - name: Verify adaptive playback schedule
        run: |
          python3 -m unittest discover -s tests -p test_native_playback_schedule.py
          python3 -m unittest discover -s tests -p test_native_playback_optimize.py
      - name: Verify extended capture contract
        run: |
          python3 -m unittest discover -s tests -p test_native_extended_capture.py -v
          python3 -m unittest discover -s tests -p test_native_capture_alignment.py -v
      - name: Install extended audiovisual capture dependencies
        run: sudo apt-get install -y ffmpeg xdotool pulseaudio pulseaudio-utils libopenal-dev
      - name: Build pinned native runtime for extended capture
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_PREPARE_ONLY: '1'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/extended-runtime
        run: |
          set -o pipefail
          bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/extended-build.ndjson" 2>&1 | tee "$RUNNER_TEMP/extended-run.log"
      - name: Record independent 30-minute CPU fixture with native audio
        run: |
          node -e 'process.stdout.write(JSON.stringify(require("./integrations/league-soccer/fixture-adapter.cjs").demo()))' > "$RUNNER_TEMP/extended-fixture.json"
          python3 integrations/league-soccer/native_extended_capture.py "$RUNNER_TEMP/extended-runtime" "$RUNNER_TEMP/extended-fixture.json" "$RUNNER_TEMP/extended-capture" --private-diagnostic
          cp "$RUNNER_TEMP/extended-capture/match.ndjson" "$RUNNER_TEMP/extended.ndjson"
          cp "$RUNNER_TEMP/extended-capture/match.ndjson.fixture.json" "$RUNNER_TEMP/extended.ndjson.fixture.json"
          cp "$RUNNER_TEMP/extended-capture/match.ndjson.attack.json" "$RUNNER_TEMP/extended.ndjson.attack.json"
          cat "$RUNNER_TEMP/extended-capture/extended-capture-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exact extended clock and full-time result
        run: |
          python3 integrations/league-soccer/native_extended_clock_verify.py "$RUNNER_TEMP/extended.ndjson" "$RUNNER_TEMP/extended-report.json"
          cat "$RUNNER_TEMP/extended-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Audit shared epoch candidate mapping
        id: alignment_audit
        continue-on-error: true
        run: |
          set -o pipefail
          python3 integrations/league-soccer/native_capture_alignment.py "$RUNNER_TEMP/extended.ndjson" "$RUNNER_TEMP/extended-capture/native-match.mp4" "$RUNNER_TEMP/extended-capture/native-match.clock-observations.json" "$RUNNER_TEMP/extended-alignment.json" | tee "$RUNNER_TEMP/alignment-summary.json"
      - name: Decode actual native framebuffer markers and verify video timestamps
        id: frame_calibration
        if: steps.alignment_audit.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 integrations/league-soccer/native_frame_calibration.py "$RUNNER_TEMP/extended-capture/native-match.mp4" "$RUNNER_TEMP/extended-capture/native-frame-markers.csv" "$RUNNER_TEMP/extended-alignment.json" "$RUNNER_TEMP/frame-calibration.json" | tee "$RUNNER_TEMP/frame-calibration-summary.json"
      - name: Analyze real extended match highlight timeline
        run: |
          set -o pipefail
          python3 integrations/league-soccer/native_highlight_detection.py "$RUNNER_TEMP/extended.ndjson" "$RUNNER_TEMP/extended-highlights.json" | tee "$RUNNER_TEMP/highlight-summary.json"
          cat "$RUNNER_TEMP/highlight-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Allocate adaptive playback budget without skipping critical moments
        id: base_schedule
        run: |
          set -o pipefail
          rc=0
          python3 integrations/league-soccer/native_playback_schedule.py "$RUNNER_TEMP/extended-highlights.json" "$RUNNER_TEMP/extended-playback.json" | tee "$RUNNER_TEMP/playback-summary.json" || rc=$?
          cat "$RUNNER_TEMP/playback-summary.json" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Optimize transition speeds and validate actual match plan
        if: always() && (steps.base_schedule.outcome == 'success' || steps.base_schedule.outcome == 'failure')
        run: |
          set -o pipefail
          test -s "$RUNNER_TEMP/extended-highlights.json"
          rc=0
          python3 integrations/league-soccer/native_playback_optimize.py "$RUNNER_TEMP/extended-highlights.json" "$RUNNER_TEMP/optimized-playback.json" | tee "$RUNNER_TEMP/optimized-summary.json" || rc=$?
          cat "$RUNNER_TEMP/optimized-summary.json" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Require candidate mapping audit to pass
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/alignment-summary.json" ]; then cat "$RUNNER_TEMP/alignment-summary.json" >> "$GITHUB_STEP_SUMMARY"; fi
          test "${{ steps.alignment_audit.outcome }}" = success
          if [ -s "$RUNNER_TEMP/frame-calibration-summary.json" ]; then cat "$RUNNER_TEMP/frame-calibration-summary.json" >> "$GITHUB_STEP_SUMMARY"; fi
          test "${{ steps.frame_calibration.outcome }}" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-native-trace
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/extended.ndjson
            ${{ runner.temp }}/extended.ndjson.fixture.json
            ${{ runner.temp }}/extended.ndjson.attack.json
            ${{ runner.temp }}/extended-report.json
            ${{ runner.temp }}/extended-highlights.json
            ${{ runner.temp }}/highlight-summary.json
            ${{ runner.temp }}/extended-playback.json
            ${{ runner.temp }}/playback-summary.json
            ${{ runner.temp }}/optimized-playback.json
            ${{ runner.temp }}/optimized-summary.json
            ${{ runner.temp }}/extended-run.log
            ${{ runner.temp }}/extended-capture/extended-capture-report.json
            ${{ runner.temp }}/extended-capture/native-match.capture.json
            ${{ runner.temp }}/extended-capture/native-match.clock-observations.json
            ${{ runner.temp }}/extended-capture/native-match.capture.log
            ${{ runner.temp }}/extended-capture/runner.log
            ${{ runner.temp }}/extended-alignment.json
            ${{ runner.temp }}/alignment-summary.json
            ${{ runner.temp }}/frame-calibration.json
            ${{ runner.temp }}/frame-calibration-summary.json
            ${{ runner.temp }}/extended-capture/native-frame-markers.csv
  media_retime:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify offline variable-speed audiovisual encoding
        run: |
          python3 -m unittest discover -s tests -p test_native_media_retime.py -v
          python3 -m unittest discover -s tests -p test_native_frame_calibration.py -v
      - name: Compile native frame marker diagnostic
        run: |
          sudo apt-get install -y libgl-dev
          cc -O2 -shared -fPIC integrations/league-soccer/native_frame_marker.c -o "$RUNNER_TEMP/native-frame-marker.so" -ldl -pthread -lGL
