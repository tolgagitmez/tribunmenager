name: Match balance audit
on:
  pull_request:
    paths: ['tools/audit-match-balance.cjs', 'tools/compare-match-balance.cjs', 'tests/match-balance-audit.test.cjs', '.github/workflows/match-balance-audit.yml']
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Seeds per scenario (12 = 144 matches, 20 = 240)'
        required: true
        default: '12'
        type: choice
        options: ['2', '12', '20']
concurrency:
  group: full-match-balance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify goal attribution and passive diagnostics
        run: node --test tests/match-balance-audit.test.cjs
  simulate:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run full natural five-minute matches
        env:
          SEEDS: ${{ inputs.seeds || '2' }}
          SHARD: ${{ matrix.shard }}
        run: node tools/audit-match-balance.cjs --seeds "$SEEDS" --shards 6 --shard "$SHARD" --out "balance/part-$SHARD.json"
      - uses: actions/upload-artifact@v4
        with:
          name: balance-part-${{ matrix.shard }}
          path: balance/part-*.json
  aggregate:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: balance-part-*
          path: balance
          merge-multiple: true
      - run: node tools/audit-match-balance.cjs --merge balance/part-*.json --out docs/validation/match-balance.json
      - uses: actions/upload-artifact@v4
        with:
          name: match-balance-report
          path: docs/validation/match-balance.json
