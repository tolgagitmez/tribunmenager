name: Native null renderer capacity pilot
on:
  push:
    branches: [experiment/native-worker-stage44]
    paths:
      - 'integrations/league-soccer/null-capacity.py'
      - 'tests/test_native_null_capacity.py'
      - '.github/workflows/native-null-capacity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p test_native_null_capacity.py
      - run: python3 -m unittest discover -s tests -p test_native_capacity.py
      - name: Build pinned runtime once
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/pool-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Gate one, two and four concurrent null matches
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/pool-fixtures"
          python3 integrations/league-soccer/null-capacity.py "$RUNNER_TEMP/pool-runtime" "$RUNNER_TEMP/pool-fixtures" "$RUNNER_TEMP/pool-results" --levels 1 2 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-null-capacity
          path: ${{ runner.temp }}/pool-results/
          if-no-files-found: ignore
