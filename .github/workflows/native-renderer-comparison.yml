name: Native OpenGL versus browser renderer comparison
on:
  push:
    branches: [experiment/native-renderer-comparison-stage111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p test_native_renderer_comparison.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build pinned native OpenGL runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/compare-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Capture real original renderer
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/compare-fixtures"
          python3 integrations/league-soccer/renderer-comparison.py "$RUNNER_TEMP/compare-runtime" "$RUNNER_TEMP/compare-fixtures/balanced.json" "$RUNNER_TEMP/renderer-comparison"
      - name: Capture corresponding browser replay and generate gallery
        run: node integrations/league-soccer/renderer-comparison-browser.cjs "$RUNNER_TEMP/renderer-comparison"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-comparison-private-diagnostic
          path: ${{ runner.temp }}/renderer-comparison/
          if-no-files-found: ignore
