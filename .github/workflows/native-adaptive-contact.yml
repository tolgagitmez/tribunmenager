name: Native adaptive contact diagnostic
on:
  push:
    branches: [experiment/native-adaptive-contact-stage56]
    paths:
      - 'integrations/league-soccer/**'
      - 'tests/test_native_adaptive_contact.py'
      - '.github/workflows/native-adaptive-contact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact-cadence:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m py_compile integrations/league-soccer/instrument.py integrations/league-soccer/adaptive-contact-benchmark.py integrations/league-soccer/timing-benchmark.py
      - run: python3 -m unittest discover -s tests -p test_native_adaptive_contact.py
      - run: python3 -m unittest discover -s tests -p test_native_collision_pose.py
      - name: Build pinned runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/adaptive-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare uniform and adaptive contact in two tactical fixtures
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/adaptive-fixtures"
          python3 integrations/league-soccer/adaptive-contact-benchmark.py "$RUNNER_TEMP/adaptive-runtime" "$RUNNER_TEMP/adaptive-fixtures" "$RUNNER_TEMP/adaptive-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-adaptive-contact
          path: ${{ runner.temp }}/adaptive-results/
          if-no-files-found: ignore
