name: League-Soccer native pilot
on:
  workflow_dispatch:
  push:
    paths:
      - 'integrations/league-soccer/**'
      - '.github/workflows/league-soccer-native-pilot.yml'
permissions:
  contents: read
jobs:
  native-trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixture adapter unit tests
        run: node --test integrations/league-soccer/fixture-adapter.test.cjs integrations/league-soccer/native-replay.test.cjs integrations/league-soccer/broadcast.test.cjs integrations/league-soccer/compare-attacks.test.cjs
      - name: Python shadow queue tests
        run: python3 -m unittest discover -s tests -p test_native_shadow.py
      - name: Build pinned upstream and capture full match
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/tribun-native-runtime
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/league-soccer.ndjson" --demo
      - name: Verify reusable native runtime from frozen fixture
        run: |
          node -e 'process.stdout.write(JSON.stringify(require("./integrations/league-soccer/fixture-adapter.cjs").demo()))' > "$RUNNER_TEMP/native-config.json"
          bash integrations/league-soccer/run-frozen.sh "$RUNNER_TEMP/tribun-native-runtime" "$RUNNER_TEMP/native-config.json" "$RUNNER_TEMP/league-soccer.ndjson.reused"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: league-soccer-native-trace
          path: ${{ runner.temp }}/league-soccer.ndjson*
          if-no-files-found: ignore
  replay-webgl:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node integrations/league-soccer/replay-browser.cjs
