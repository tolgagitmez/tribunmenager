name: League-Soccer native pilot
on:
  workflow_dispatch:
    inputs:
      diagnose_substitutions:
        description: 'Run quarantined halftime substitution crash diagnostic'
        type: boolean
        default: false
  push:
    paths:
      - 'integrations/league-soccer/**'
      - 'native_live.py'
      - 'native_shadow.py'
      - 'tests/test_native_*.py'
      - '.github/workflows/league-soccer-native-pilot.yml'
permissions:
  contents: read
jobs:
  native-trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixture adapter unit tests
        run: node --test integrations/league-soccer/fixture-adapter.test.cjs integrations/league-soccer/native-replay.test.cjs integrations/league-soccer/native-foot-plant.test.cjs integrations/league-soccer/native-contact-sync.test.cjs integrations/league-soccer/native-strike-motion.test.cjs integrations/league-soccer/native-control-motion.test.cjs integrations/league-soccer/native-duel-motion.test.cjs integrations/league-soccer/native-tackle-motion.test.cjs integrations/league-soccer/native-keeper-motion.test.cjs integrations/league-soccer/native-aerial-motion.test.cjs integrations/league-soccer/native-animation-blend.test.cjs integrations/league-soccer/native-motion-matching.test.cjs integrations/league-soccer/native-motion-identity.test.cjs integrations/league-soccer/native-anatomy.test.cjs integrations/league-soccer/native-clip-library.test.cjs integrations/league-soccer/native-contact-precision.test.cjs integrations/league-soccer/native-ground-recovery.test.cjs integrations/league-soccer/native-keeper-completion.test.cjs integrations/league-soccer/replay-performance.test.cjs integrations/league-soccer/broadcast.test.cjs integrations/league-soccer/compare-attacks.test.cjs integrations/league-soccer/native-stream-view.test.cjs integrations/league-soccer/native-advisor.test.cjs
      - name: Python shadow queue tests
        run: python3 -m unittest discover -s tests -p 'test_native_*.py'
      - name: Build pinned upstream and capture full match
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/tribun-native-runtime
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/league-soccer.ndjson" --demo
      - name: Measure native replay foot contact (first 30 seconds of recording)
        run: node integrations/league-soccer/foot-plant-benchmark.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.foot-plant.json"
      - name: Audit recorded native contacts and visual toe error
        run: node integrations/league-soccer/contact-sync-benchmark.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.contact-sync.json"
      - name: Audit recorded control gesture coverage
        run: node integrations/league-soccer/control-motion-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.control-motion.json"
      - name: Audit native duel reaction coverage
        run: node integrations/league-soccer/duel-motion-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.duel-motion.json"
      - name: Audit tackle, trip and referee event coverage
        run: node integrations/league-soccer/tackle-motion-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.tackle-motion.json"
      - name: Audit native keeper events and palm target error
        run: node integrations/league-soccer/keeper-motion-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.keeper-motion.json"
      - name: Audit recorded head contact and aerial pose coverage
        run: node integrations/league-soccer/aerial-motion-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.aerial-motion.json"
      - name: Compare combined animation transition target discontinuities
        run: node integrations/league-soccer/animation-blend-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.animation-blend.json"
      - name: Compare motion matching stance and step coverage
        run: node integrations/league-soccer/motion-matching-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.motion-matching.json"
      - name: Audit player-specific movement parameters
        run: node integrations/league-soccer/motion-identity-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.motion-identity.json"
      - name: Audit native player height and anatomy
        run: node integrations/league-soccer/anatomy-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.anatomy.json"
      - name: Compare recorded contact surface errors in centimetres
        run: node integrations/league-soccer/contact-precision-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.contact-precision.json"
      - name: Audit ground recovery and torso overlap proxies
        run: node integrations/league-soccer/ground-recovery-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.ground-recovery.json"
      - name: Audit confirmed lateral keeper reach
        run: node integrations/league-soccer/keeper-completion-audit.cjs "$RUNNER_TEMP/league-soccer.ndjson" > "$RUNNER_TEMP/league-soccer.ndjson.keeper-completion.json"
      - name: Verify reusable native runtime from frozen fixture
        run: |
          node -e 'process.stdout.write(JSON.stringify(require("./integrations/league-soccer/fixture-adapter.cjs").demo()))' > "$RUNNER_TEMP/native-config.json"
          python3 integrations/league-soccer/manager-control-smoke.py "$RUNNER_TEMP/tribun-native-runtime" "$RUNNER_TEMP/native-config.json" "$RUNNER_TEMP/league-soccer.ndjson.reused"
      - name: Experimental prewarmed reserve diagnostic (opt-in)
        if: ${{ inputs.diagnose_substitutions }}
        env:
          TRIBUN_NATIVE_EXPERIMENTAL_SUBSTITUTIONS: '1'
        run: |
          node -e 'const c=require("./integrations/league-soccer/fixture-adapter.cjs").demo(); for(const [r,s] of [[c.players,c.starters],[c.awayPlayers,c.awayStarters]])r.push({...r[0],id:100,name:"Reserve"}); c.nativeSubstitutions=[[{out:c.starters[0],in:100}],[{out:c.awayStarters[0],in:100}]]; console.log(JSON.stringify(c))' > "$RUNNER_TEMP/sub-config.json"
          bash integrations/league-soccer/run-frozen.sh "$RUNNER_TEMP/tribun-native-runtime" "$RUNNER_TEMP/sub-config.json" "$RUNNER_TEMP/league-soccer.ndjson.sub"
          python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); assert len(s["substitutions"])==2 and all(c["performed"] for c in s["substitutions"])' "$RUNNER_TEMP/league-soccer.ndjson.sub.season.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: league-soccer-native-trace
          path: ${{ runner.temp }}/league-soccer.ndjson*
          if-no-files-found: ignore
  replay-webgl:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node integrations/league-soccer/replay-browser.cjs
      - name: Exercise league pilot reconnect and mobile presentation
        run: node integrations/league-soccer/native-stream-browser.cjs
