name: Stabilization - complete integration gate
on:
  push:
    branches: ['fix/integration-stability-20261124']
  pull_request:
    branches: [main]
    paths:
      - 'assets/player/**'
      - 'assets/interchange/**'
      - 'football-sim.js'
      - 'humanoid-rig.js'
      - '.github/workflows/stabilization-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-player-assets.txt
      - run: npm run test:stage15
      - run: npm run test:manager-kick && npm run test:live-match
  individual-and-team-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:collective-ai
      - run: npm run test:individual-keeper
      - run: npm run test:individual-defence
      - run: npm run test:offball
      - run: npm run test:duel-wallpass
      - run: npm run test:render-budget
      - run: npm run test:onball-presentation
  organic-match:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Revalidate the discovered strict two-manager fixture; search remaining seeds if needed
        run: |
          if PROBE_FIRST_SEED=12 PROBE_MAX_SEED=12 node tools/find-live-match-fixture.cjs > fixture12.log && grep -q '^FOUND_STRICT ' fixture12.log; then
            cat fixture12.log
          else
            cat fixture12.log
            node tools/find-live-match-fixture.cjs
          fi
      - run: node tools/profile-current-attack-chain.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: integration-attack-audit
          path: docs/validation/current-attack-120s.json
