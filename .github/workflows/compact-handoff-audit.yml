name: Compact attack handoff calibration
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/audit-compact-handoff.cjs'
      - '.github/workflows/compact-handoff-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-press:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:collective-ai
      - run: node tools/audit-compact-handoff.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-handoff-audit
          path: docs/validation/compact-handoff-audit.json
          if-no-files-found: warn
