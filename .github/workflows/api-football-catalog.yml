name: API-Football catalog offline validation
on:
  push:
    branches: ['feature/api-football-access-probe']
    paths: ['tools/api_football_catalog.py', 'api-football-roster.cjs', 'api-football-ratings.cjs', 'api-football-ratings.js', 'api-football-roster.js', 'catalog-friendly*', 'local_file_guard.py', 'server.py', 'start.py', 'tests/test_api_football_local_privacy.py', 'tests/catalog-friendly-browser.test.cjs', 'match.html', 'match3d.js', 'index.html', 'tests/catalog-friendly.test.cjs', 'economy.py', 'transfers-page.js', 'data/**', 'tools/import_api_football_market.py', 'tools/api-football-market-export.cjs', 'tests/test_api_football_market.py', 'tests/api-football-ratings.test.cjs', 'tests/test_api_football_catalog.py', 'tests/api-football-roster.test.cjs', '.github/workflows/api-football-catalog.yml']
  pull_request:
    paths: ['tools/api_football_catalog.py', 'api-football-roster.cjs', 'api-football-ratings.cjs', 'api-football-ratings.js', 'api-football-roster.js', 'catalog-friendly*', 'local_file_guard.py', 'server.py', 'start.py', 'tests/test_api_football_local_privacy.py', 'tests/catalog-friendly-browser.test.cjs', 'match.html', 'match3d.js', 'index.html', 'tests/catalog-friendly.test.cjs', 'economy.py', 'transfers-page.js', 'data/**', 'tools/import_api_football_market.py', 'tools/api-football-market-export.cjs', 'tests/test_api_football_market.py', 'tests/api-football-ratings.test.cjs', 'tests/test_api_football_catalog.py', 'tests/api-football-roster.test.cjs', '.github/workflows/api-football-catalog.yml']
permissions:
  contents: read
concurrency:
  group: api-football-catalog-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -p 'test_api_football*.py' -v
      - run: npm ci --ignore-scripts
      - run: node --test tests/api-football-roster.test.cjs tests/api-football-ratings.test.cjs tests/catalog-friendly.test.cjs tests/catalog-friendly-browser.test.cjs
