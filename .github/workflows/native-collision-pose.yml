name: Native collision pose separation diagnostic
on:
  push:
    branches: [experiment/native-collision-pose-stage54]
    paths:
      - 'integrations/league-soccer/**'
      - 'tests/test_native_collision_pose.py'
      - '.github/workflows/native-collision-pose.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordered-pose:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m py_compile integrations/league-soccer/instrument.py integrations/league-soccer/collision-pose-benchmark.py
      - run: python3 -m unittest discover -s tests -p test_native_collision_pose.py
      - run: python3 -m unittest discover -s tests -p test_native_profile_repeatability.py
      - name: Build pinned runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/collision-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare ordered visual and simulation collision poses
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/collision-fixtures"
          python3 integrations/league-soccer/collision-pose-benchmark.py "$RUNNER_TEMP/collision-runtime" "$RUNNER_TEMP/collision-fixtures" "$RUNNER_TEMP/collision-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-collision-pose
          path: ${{ runner.temp }}/collision-results/
          if-no-files-found: ignore
