name: Stage 155 native verification lease
on:
  push:
    branches: [experiment/native-verification-lease-stage155]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest discover -s tests -p test_native_verification_lease.py
          python3 -m unittest discover -s tests -p test_native_worker_recovery.py
          python3 -m unittest discover -s tests -p test_native_av_queue.py
          python3 -m unittest discover -s tests -p test_native_match_lifecycle.py
          python3 -m py_compile integrations/league-soccer/native_av_queue.py
