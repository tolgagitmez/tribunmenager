name: Native ordered pose repeatability diagnostic
on:
  push:
    branches: [experiment/native-ordered-pose-stage53]
    paths:
      - 'integrations/league-soccer/**'
      - 'tests/test_native_ordered_pose.py'
      - '.github/workflows/native-ordered-pose.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordered-pose:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m py_compile integrations/league-soccer/instrument.py integrations/league-soccer/ordered-pose-benchmark.py
      - run: python3 -m unittest discover -s tests -p test_native_ordered_pose.py
      - run: python3 -m unittest discover -s tests -p test_native_profile_repeatability.py
      - name: Build pinned runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/ordered-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare asynchronous and ordered pose trajectories
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/ordered-fixtures"
          python3 integrations/league-soccer/ordered-pose-benchmark.py "$RUNNER_TEMP/ordered-runtime" "$RUNNER_TEMP/ordered-fixtures" "$RUNNER_TEMP/ordered-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ordered-pose
          path: ${{ runner.temp }}/ordered-results/
          if-no-files-found: ignore
