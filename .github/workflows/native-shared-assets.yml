name: Native shared assets diagnostic
on:
  push:
    branches: [experiment/native-assets-stage45]
    paths:
      - 'integrations/league-soccer/**'
      - 'tests/test_native_shared_assets.py'
      - '.github/workflows/native-shared-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-assets:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p test_native_shared_assets.py
      - run: python3 -m unittest discover -s tests -p test_native_null_capacity.py
      - name: Build native runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/assets-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare two simultaneous matches per layout
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/assets-fixtures"
          python3 integrations/league-soccer/shared-assets-benchmark.py "$RUNNER_TEMP/assets-runtime" "$RUNNER_TEMP/assets-fixtures/balanced.json" "$RUNNER_TEMP/assets-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-assets-diagnostic
          path: ${{ runner.temp }}/assets-results/
          if-no-files-found: ignore
