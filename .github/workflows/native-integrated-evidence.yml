name: Stage 138 integrated native match and season replay
on:
  push:
    branches: [experiment/native-integrated-evidence-stage138]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 -m unittest discover -s tests -p test_native_integrated_replay.py
          python3 -m unittest discover -s tests -p test_native_av_queue.py
          python3 -m unittest discover -s tests -p test_native_audio_ownership.py
          python3 -m unittest discover -s tests -p test_native_motion_audit.py
          python3 -m unittest discover -s tests -p test_native_audio_capture.py
          python3 -m unittest discover -s tests -p test_native_av_isolation.py
          python3 -m unittest discover -s tests -p test_native_admission.py
          python3 -m unittest discover -s tests -p test_native_av_capacity.py
          python3 -m py_compile integrations/league-soccer/native-video-pilot.py integrations/league-soccer/native-av-capacity.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xdotool xvfb xauth pulseaudio pulseaudio-utils libopenal-dev
      - name: Verify simultaneous private Pulse servers
        run: python3 integrations/league-soccer/native_audio_isolation_smoke.py
      - name: Verify two real OpenAL sources with distinct tones
        run: python3 integrations/league-soccer/native_openal_isolation_smoke.py
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Build pinned engine
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/render-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Run two native matches with motion diagnostics
        run: |
          set -uo pipefail
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/render-fixtures" || exit 1
          failed=0
          for workers in 2; do
            python3 integrations/league-soccer/native-av-capacity.py "$RUNNER_TEMP/render-runtime" "$RUNNER_TEMP/render-fixtures" "$RUNNER_TEMP/render-$workers" --count 2 --motion-audit --gl-workers "$workers" --filter-threads 1 || failed=1
          done
          exit "$failed"
      - name: Verify actual recordings and replay private season transaction
        if: always()
        run: python3 integrations/league-soccer/native_integrated_replay.py "$RUNNER_TEMP/render-2" "$RUNNER_TEMP/integrated-replay.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-native-match-evidence
          path: |
            ${{ runner.temp }}/integrated-replay.json
            ${{ runner.temp }}/render-*/capacity-report.json
            ${{ runner.temp }}/render-*/*/native-motion-report.json
            ${{ runner.temp }}/render-*/*/live-report.json
            ${{ runner.temp }}/render-*/*/native-audio-ownership.json
            ${{ runner.temp }}/render-*/*/native-audio-ready.json
          if-no-files-found: ignore
