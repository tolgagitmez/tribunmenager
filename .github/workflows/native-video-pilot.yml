name: Original native full match video pilot
on:
  push:
    branches: [experiment/native-authoritative-presentation-stage114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p test_native_video_pilot.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xdotool xvfb xauth
      - name: Build frozen OpenGL runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/native-video-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Original renderer full match and capture verification
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/video-fixtures"
          python3 integrations/league-soccer/native-video-pilot.py "$RUNNER_TEMP/native-video-runtime" "$RUNNER_TEMP/video-fixtures/balanced.json" "$RUNNER_TEMP/native-video-result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-video-measurement-only
          path: |
            ${{ runner.temp }}/native-video-result/native-video-report.json
            ${{ runner.temp }}/native-video-result/runner.log
          if-no-files-found: ignore
