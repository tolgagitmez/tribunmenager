name: Stage 148 native asset rights gate
on:
  push:
    branches: [experiment/native-rights-stage148]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest discover -s tests -p test_native_rights_audit.py
          python3 integrations/league-soccer/native_rights_audit.py --output "$RUNNER_TEMP/rights-report.json"
          set +e
          python3 integrations/league-soccer/native_rights_audit.py --require-commercial
          rc=$?
          set -e
          test "$rc" = 2
      - uses: actions/upload-artifact@v4
        with:
          name: native-rights-review
          path: ${{ runner.temp }}/rights-report.json
