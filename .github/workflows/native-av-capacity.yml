name: Stage 124 native audiovisual concurrency
on:
  push:
    branches: [experiment/native-av-capacity-stage124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrent:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xdotool xvfb xauth pulseaudio pulseaudio-utils libopenal-dev
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Check diagnostic code
        run: |
          python3 -m py_compile integrations/league-soccer/native-av-capacity.py
          python3 -m unittest discover -s tests -p test_native_command_evidence.py
          node --test integrations/league-soccer/native-live-video.test.cjs integrations/league-soccer/native-playback-evidence.test.cjs
      - name: Build pinned original engine
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/capacity-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Run two matches on the same runner with independent browsers and manager controls
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/capacity-fixtures"
          python3 integrations/league-soccer/native-av-capacity.py "$RUNNER_TEMP/capacity-runtime" "$RUNNER_TEMP/capacity-fixtures" "$RUNNER_TEMP/capacity-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-av-capacity-evidence
          path: |
            ${{ runner.temp }}/capacity-results/capacity-report.json
            ${{ runner.temp }}/capacity-results/*/live-report.json
            ${{ runner.temp }}/capacity-results/*/browser-playback-report.json
          if-no-files-found: ignore
