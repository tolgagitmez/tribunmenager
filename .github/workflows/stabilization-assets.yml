name: Stabilization - rebuild licensed assets
on:
  push:
    branches: ['fix/integration-stability-20261124']
    paths: ['.github/workflows/stabilization-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    if: github.ref == 'refs/heads/fix/integration-stability-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-player-assets.txt
      - name: Regenerate licensed derivative from pinned packaged originals
        run: |
          set -euo pipefail
          python tools/build-player-assets.py --from-package assets/player --output "$RUNNER_TEMP/rebuilt-player"
          # Source evidence must be identical, not merely regenerated hashes.
          for f in LICENSE-CC0.txt SOURCE-LICENSE.md source/makehuman-base.obj.gz source/makehuman-default.mhskel.gz source/makehuman-default_weights.mhw.gz source/provenance.json; do
            cmp "assets/player/$f" "$RUNNER_TEMP/rebuilt-player/$f"
          done
          cp -a "$RUNNER_TEMP/rebuilt-player/." assets/player/
          node --test tests/player-assets.test.cjs tests/player-asset-status.test.cjs tests/character-licensed-rig.test.cjs
          python -m unittest discover -s tests -p test_player_assets.py -v
      - name: Obtain reviewed Blender version and verify official release digest
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=https://download.blender.org/release/Blender4.3
          archive=blender-4.3.2-linux-x64.tar.xz
          curl --fail --location --retry 3 "$base/blender-4.3.2.sha256" -o checksums.txt
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          grep -F "$archive" checksums.txt > blender.sha256
          test "$(wc -l < blender.sha256)" -eq 1
          sha256sum --check blender.sha256
          tar -xf "$archive"
          echo "$RUNNER_TEMP/blender-4.3.2-linux-x64" >> "$GITHUB_PATH"
      - name: Rebuild and validate Blender interchange
        run: |
          set -euo pipefail
          blender --version
          npm run rebuild:interchange
          npm run test:gltf
          npm run test:character-rig
          npm run test:match-animation
          npm run test:match-fps
          npm run test:character-human
      - name: Publish evidence archive even if a later commit fails
        uses: actions/upload-artifact@v4
        with:
          name: validated-stabilization-asset-package
          path: |
            assets/player/footballer.glb
            assets/player/player-model-data.js
            assets/player/skeleton.json
            assets/player/manifest.json
            assets/player/CREDITS.md
            assets/player/textures/
            assets/interchange/
          if-no-files-found: error
      - name: Commit verified generated derivatives to stabilization branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/integration-stability-20261124
          # Do not replace any source or unrelated file; no force push.
          git diff --exit-code -- assets/player/source assets/player/LICENSE-CC0.txt assets/player/SOURCE-LICENSE.md
          git add assets/player/footballer.glb assets/player/player-model-data.js assets/player/skeleton.json assets/player/manifest.json assets/player/CREDITS.md assets/player/textures assets/interchange
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(assets): rebuild licensed human and Blender interchange from reviewed rig"
          git push origin HEAD:refs/heads/fix/integration-stability-20261124
