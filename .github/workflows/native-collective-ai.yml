name: Native collective football diagnostic
on:
  push:
    branches: [experiment/native-collective-ai-stage96]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collective:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m py_compile integrations/league-soccer/short_match_patch.py integrations/league-soccer/instrument.py integrations/league-soccer/collective-ai-benchmark.py integrations/league-soccer/timing-benchmark.py
      - run: python3 -m unittest discover -s tests -p test_native_collective_ai.py
      - run: python3 -m unittest discover -s tests -p test_native_run_lanes.py
      - run: python3 -m unittest discover -s tests -p test_native_triangle.py
      - run: python3 -m unittest discover -s tests -p test_native_defense_shape.py
      - run: python3 -m unittest discover -s tests -p test_native_transition.py
      - name: Build pinned runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/collective-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare collective profile in three tactical fixtures
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/collective-fixtures"
          python3 integrations/league-soccer/collective-ai-benchmark.py "$RUNNER_TEMP/collective-runtime" "$RUNNER_TEMP/collective-fixtures" "$RUNNER_TEMP/collective-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-collective-ai
          path: ${{ runner.temp }}/collective-results/
          if-no-files-found: ignore
