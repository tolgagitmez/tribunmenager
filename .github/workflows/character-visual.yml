name: Character WebGL visual smoke

on:
  push:
    branches:
      - feature/character-glb-animation-v1
  pull_request:
    paths:
      - 'assets/player/**'
      - 'player-studio.html'
      - 'player-studio.js'
      - 'humanoid-rig.js'
      - 'player-renderer.js'
      - 'tools/check-character-browser.cjs'
      - '.github/workflows/character-visual.yml'

jobs:
  browser-character:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser smoke dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.0 pngjs@7.0.0
          npx playwright install chromium --with-deps
      - name: Render actual 3D studio poses with SwiftShader
        run: node tools/check-character-browser.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-webgl-smoke
          path: dist/character-visual/
          if-no-files-found: warn
          retention-days: 30
