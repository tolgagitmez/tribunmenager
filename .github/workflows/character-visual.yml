name: Character WebGL visual smoke

on:
  push:
    branches:
      - feature/character-glb-animation-v1
      - feature/character-footlock-glb-viewer-v1
      - feature/character-kick-transition-sole-v1
      - feature/character-blend-loop-contact-v1
      - feature/match-animation-bridge-22players-v1
      - integration/character-pr3-9-licensed-compatible
      - main
  pull_request:
    paths:
      - 'assets/player/**'
      - 'player-studio.html'
      - 'player-studio-procedural.html'
      - 'player-studio-procedural.js'
      - 'player-renderer-procedural.js'
      - 'player-studio.js'
      - 'humanoid-rig.js'
      - 'player-renderer.js'
      - 'tools/check-character-browser.cjs'
      - 'tools/check-independent-glb-browser.cjs'
      - 'tools/serve-character-viewer.cjs'
      - 'character-viewer.html'
      - 'character-blend-controller.js'
      - 'match-animation-bridge.js'
      - 'scene3d.js'
      - 'match3d.js'
      - 'match.html'
      - 'tools/benchmark-match-22-browser.cjs'
      - '.github/workflows/character-visual.yml'

jobs:
  browser-character:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser smoke dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.0 pngjs@7.0.0 three@0.181.2
          npx playwright install chromium --with-deps
      - name: Render actual 3D studio poses with SwiftShader
        run: node tools/check-character-browser.cjs
      - name: Test independent GLB animation viewer
        run: node tools/check-independent-glb-browser.cjs
      - name: Benchmark the real 22-player 3D match with the blend bridge
        run: node tools/benchmark-match-22-browser.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-webgl-smoke
          path: |
            dist/character-visual/
            dist/character-glb-viewer/
            dist/match-animation-benchmark/
          if-no-files-found: warn
          retention-days: 30
