name: Native combined AI diagnostic
on:
  push:
    branches: [experiment/native-combined-ai-stage102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash -n integrations/league-soccer/run-frozen.sh
      - run: python3 -m unittest discover -s tests -p 'test_native_*ai.py'
      - run: python3 -m unittest discover -s tests -p test_native_match_pace.py
      - name: Build pinned runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/combined-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare six matches with isolated combined profile
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/combined-fixtures"
          python3 integrations/league-soccer/combined-ai-benchmark.py "$RUNNER_TEMP/combined-runtime" "$RUNNER_TEMP/combined-fixtures" "$RUNNER_TEMP/combined-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-combined-ai
          path: ${{ runner.temp }}/combined-results/
          if-no-files-found: ignore
