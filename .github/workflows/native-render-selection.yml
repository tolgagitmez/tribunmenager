name: Stage 135 repeated render profile selection
on:
  push:
    branches: [experiment/native-render-selection-stage135]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 -m unittest discover -s tests -p test_native_render_selection.py
          python3 -m unittest discover -s tests -p test_native_swap_probe.py
          python3 -m unittest discover -s tests -p test_native_admission.py
          python3 -m unittest discover -s tests -p test_native_av_capacity.py
          python3 -m py_compile integrations/league-soccer/native-video-pilot.py integrations/league-soccer/native-av-capacity.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xdotool xvfb xauth pulseaudio pulseaudio-utils libopenal-dev
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Build pinned engine
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/render-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Repeat paired comparisons in ABBA order
        run: |
          set -uo pipefail
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/render-fixtures" || exit 1
          failed=0
          for label in a2 a1 b1 b2; do
            workers="${label:1:1}"
            python3 integrations/league-soccer/native-av-capacity.py "$RUNNER_TEMP/render-runtime" "$RUNNER_TEMP/render-fixtures" "$RUNNER_TEMP/render-$label" --count 2 --render-probe --gl-workers "$workers" --filter-threads 1 || failed=1
          done
          python3 integrations/league-soccer/native_render_selection.py "$RUNNER_TEMP/render-selection.json" --pair "$RUNNER_TEMP/render-a2/capacity-report.json" "$RUNNER_TEMP/render-a1/capacity-report.json" --pair "$RUNNER_TEMP/render-b2/capacity-report.json" "$RUNNER_TEMP/render-b1/capacity-report.json" || exit 1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repeated-render-selection-evidence
          path: |
            ${{ runner.temp }}/render-selection.json
            ${{ runner.temp }}/render-*/capacity-report.json
            ${{ runner.temp }}/render-*/*/native-render-report.json
            ${{ runner.temp }}/render-*/*/live-report.json
          if-no-files-found: ignore
