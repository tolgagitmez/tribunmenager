name: Central box support
on:
  push:
    branches: ['fix/central-box-support-20261124']
    paths: ['.github/workflows/central-box-support.yml', 'football-sim.js', 'tests/central-box-support.test.cjs']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check football-sim.js
      - run: node --test tests/central-box-support.test.cjs tests/offball-intelligence.test.cjs tests/collective-team-ai.test.cjs tests/team-plan-arbitration.test.cjs tests/attack-breakpoint.test.cjs tests/pass-trajectory-safety.test.cjs
      - run: node tools/profile-current-attack-chain.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: central-box-support-natural
          path: docs/validation/current-attack-120s.json
