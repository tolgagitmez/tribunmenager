name: League-Soccer concurrent native capacity
on:
  workflow_dispatch:
  push:
    branches: [integration/league-soccer-native]
    paths:
      - 'integrations/league-soccer/capacity-benchmark.py'
      - 'tests/test_native_capacity_benchmark.py'
      - '.github/workflows/league-soccer-capacity.yml'
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p test_native_capacity_benchmark.py
      - name: Build native runtime once
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/capacity-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Measure six matches in concurrency groups 1, 2, 3
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/capacity-fixtures"
          python3 integrations/league-soccer/capacity-benchmark.py "$RUNNER_TEMP/capacity-runtime" "$RUNNER_TEMP/capacity-fixtures" "$RUNNER_TEMP/capacity"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-capacity-diagnostics
          path: ${{ runner.temp }}/capacity/
          if-no-files-found: ignore
