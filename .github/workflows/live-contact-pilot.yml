name: Wing attack, live Blender contact and 22-player frame budgets
on:
  push:
    branches:
      - feature/live-contact-animation-pilot
  pull_request:
    paths:
      - football-sim.js
      - humanoid-rig.js
      - live-match-view.js
      - live-match-worker.cjs
      - match-contact-pilot.js
      - match-contact-events.js
      - match-clip-pilot.mjs
      - match-boot-contact.mjs
      - ball-visual.js
      - match.html
      - match3d.js
      - player-renderer.js
      - scene3d.js
      - package.json
      - tests/live-contact-animation-pilot.test.cjs
      - tests/live-match-presentation.test.cjs
      - tests/match-boot-contact.test.cjs
      - 'tests/wing-attack*.cjs'
      - tools/benchmark-live-contact-pilot.cjs
      - tools/wing-attack-scenario.cjs
      - .github/workflows/live-contact-pilot.yml
  workflow_dispatch:
jobs:
  physics-and-footlock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Both feet, pressure, contact timeline and deformed boot surface
        run: npm run test:wing-attack
      - name: Existing contact and licensed skeleton invariants
        run: node --test tests/character-footlock.test.cjs tests/character-licensed-rig.test.cjs tests/character-kick-transition.test.cjs tests/match-animation-bridge.test.cjs tests/match-fps-profiles.test.cjs
      - name: Existing live match fixture
        run: npm run test:live-match
  reference-frame-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install Chromium for hardware-agnostic software reference
        run: npx playwright install --with-deps chromium
      - name: Wing attack on the local canvas and in two live browser contexts
        run: npm run test:wing-attack-browser
      - name: Real match 22-players desktop and emulated mobile 95th percentile
        run: node tools/benchmark-live-contact-pilot.cjs
      - name: Upload wing attack screenshot evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wing-attack-desktop-mobile-evidence
          path: work/wing-attack-browser/
          retention-days: 30
      - name: Upload frame profile and real match screenshot evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-contact-match-desktop-mobile-profile
          path: dist/live-contact-pilot/
          retention-days: 30
