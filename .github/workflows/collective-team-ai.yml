name: Collective team intelligence
on:
  push:
    branches: ['feature/collective-team-ai-20261124']
  pull_request:
    paths:
      - 'football-sim.js'
      - 'player-brain.js'
      - 'team-intent.js'
      - 'tests/collective-team-ai.test.cjs'
      - '.github/workflows/collective-team-ai.yml'
jobs:
  team:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check football-sim.js && node --check player-brain.js && node --check team-intent.js
      - run: npm run test:collective-ai
      - run: node --test tests/individual-defence.test.cjs tests/offball-intelligence.test.cjs tests/defender-duel-wallpass.test.cjs tests/post-receive-hold.test.cjs tests/pass-preparation.test.cjs tests/aerial-keeper-law-boundaries.test.cjs tests/22-player-render-budget.test.cjs
