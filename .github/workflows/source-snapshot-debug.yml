name: Debug source snapshot for local deterministic repro
on:
  push:
    branches: [feature/main-specialist-kick-physics-20261122]
    paths:
      - '.github/workflows/source-snapshot-debug.yml'
      - 'football-sim.js'
      - 'tools/compare-specialist-kicks.cjs'
      - 'tests/kick-skill-parity.test.cjs'
  workflow_dispatch:
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package tracked JS, Python, HTML, CSS and config sources for offline diagnosis
        run: |
          python3 - <<'PY'
          import tarfile,subprocess,pathlib
          patterns={'.js','.cjs','.mjs','.py','.json','.css','.html','.md','.yaml','.yml','.txt','.sh'}
          filenames=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          selected=[p for p in filenames if p and pathlib.Path(p).suffix.lower() in patterns and pathlib.Path(p).is_file()]
          with tarfile.open('/tmp/debug-source.tar.gz','w:gz') as target:
              for p in selected:target.add(p,arcname=p)
          print('ARCHIVE',len(selected),'tracked source files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: main-specialist-source-snapshot
          path: /tmp/debug-source.tar.gz
          retention-days: 2
