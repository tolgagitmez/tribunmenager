name: Native central box support paired diagnostic
on:
  workflow_dispatch:
  push:
    branches: [integration/league-soccer-native]
    paths:
      - 'integrations/league-soccer/box-runs-benchmark.py'
      - '.github/workflows/native-box-runs.yml'
permissions:
  contents: read
jobs:
  box-runs:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned native runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/box-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Paired six-match comparison
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/box-fixtures"
          python3 integrations/league-soccer/box-runs-benchmark.py "$RUNNER_TEMP/box-runtime" "$RUNNER_TEMP/box-fixtures" "$RUNNER_TEMP/box-runs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-box-runs-diagnostics
          path: ${{ runner.temp }}/box-runs/
          if-no-files-found: ignore
