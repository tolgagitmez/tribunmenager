name: Native high precision contact cadence diagnostic
on:
  push:
    branches: [experiment/native-contact-cadence-stage55]
    paths:
      - 'integrations/league-soccer/**'
      - 'tests/test_native_contact_cadence.py'
      - '.github/workflows/native-contact-cadence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact-cadence:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m py_compile integrations/league-soccer/instrument.py integrations/league-soccer/contact-cadence-benchmark.py integrations/league-soccer/timing-benchmark.py
      - run: python3 -m unittest discover -s tests -p test_native_contact_cadence.py
      - run: python3 -m unittest discover -s tests -p test_native_collision_pose.py
      - name: Build pinned runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/contact-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare four contact cadences in two tactical fixtures
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/contact-fixtures"
          python3 integrations/league-soccer/contact-cadence-benchmark.py "$RUNNER_TEMP/contact-runtime" "$RUNNER_TEMP/contact-fixtures" "$RUNNER_TEMP/contact-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-contact-cadence
          path: ${{ runner.temp }}/contact-results/
          if-no-files-found: ignore
