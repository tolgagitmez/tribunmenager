name: Native null renderer diagnostic
on:
  push:
    branches: [experiment/native-null-stage43]
    paths:
      - 'integrations/league-soccer/**'
      - 'tests/test_native_null_renderer.py'
      - '.github/workflows/native-null-renderer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  null-renderer:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p test_native_null_renderer.py
      - run: python3 -m unittest discover -s tests -p test_native_no_upload.py
      - name: Build pinned runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/null-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare native OpenGL and SDL dummy null backend
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/null-fixtures"
          python3 integrations/league-soccer/null-renderer-benchmark.py "$RUNNER_TEMP/null-runtime" "$RUNNER_TEMP/null-fixtures/counter-possession.json" "$RUNNER_TEMP/null-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-null-renderer
          path: ${{ runner.temp }}/null-results/
          if-no-files-found: ignore
