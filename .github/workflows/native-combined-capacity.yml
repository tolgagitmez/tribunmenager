name: Native combined AI capacity diagnostic
on:
  push:
    branches: [experiment/native-combined-capacity-stage103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capacity and queue transaction regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_native_*capacity*.py'
          python3 -m unittest discover -s tests -p test_native_shadow.py
      - name: Build single frozen runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/combined-pool-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare one, two and three concurrent combined AI matches
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/combined-pool-fixtures"
          python3 integrations/league-soccer/combined-capacity.py "$RUNNER_TEMP/combined-pool-runtime" "$RUNNER_TEMP/combined-pool-fixtures" "$RUNNER_TEMP/combined-pool-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-combined-capacity
          path: ${{ runner.temp }}/combined-pool-results/
          if-no-files-found: ignore
