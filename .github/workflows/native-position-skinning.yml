name: Native position-only skinning diagnostic
on:
  push:
    branches: [experiment/native-skinning-stage49]
    paths:
      - 'integrations/league-soccer/**'
      - 'tests/test_native_position_skinning.py'
      - '.github/workflows/native-position-skinning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skinning:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p test_native_position_skinning.py
      - name: Build pinned runtime
        env:
          TRIBUN_INSTALL_NATIVE_DEPS: '1'
          TRIBUN_BUILD_JOBS: '3'
          TRIBUN_NATIVE_RUNTIME_OUT: ${{ runner.temp }}/skinning-runtime
          TRIBUN_PREPARE_ONLY: '1'
        run: bash integrations/league-soccer/run-pilot.sh "$RUNNER_TEMP/unused.ndjson" --demo
      - name: Compare full and position-only skinning
        run: |
          node integrations/league-soccer/readiness-fixtures.cjs "$RUNNER_TEMP/skinning-fixtures"
          python3 integrations/league-soccer/position-skinning-benchmark.py "$RUNNER_TEMP/skinning-runtime" "$RUNNER_TEMP/skinning-fixtures/balanced.json" "$RUNNER_TEMP/skinning-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-position-skinning
          path: ${{ runner.temp }}/skinning-results/
          if-no-files-found: ignore
