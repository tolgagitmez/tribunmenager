name: Stage 142 worker lease and crash fencing
on:
  push:
    branches: [experiment/native-worker-recovery-stage142]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest discover -s tests -p test_native_worker_recovery.py
          python3 -m unittest discover -s tests -p test_native_av_queue.py
          python3 -m unittest discover -s tests -p test_native_av_gateway.py
          python3 -m unittest discover -s tests -p test_native_av_capacity.py
          python3 -m py_compile integrations/league-soccer/native_av_queue.py integrations/league-soccer/native-av-capacity.py
